name: "Set up system"
description: "Set up system"

inputs:
  python:
    description: "Python interpreter version"
    required: true
  chrome:
    description: "Chrome version"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install Qt dependencies
      uses: tlambert03/setup-qt-libs@v1

    - name: Set up chromedriver
      shell: bash
      run: |
        set -euo pipefail
        chrome_version=${{ inputs.chrome }}
        milestone="${chrome_version%%.*}"

        # Try legacy chromedriver API first (Chrome <115)
        legacy_url="http://chromedriver.storage.googleapis.com/LATEST_RELEASE_${milestone}"
        cft_json_url="https://googlechromelabs.github.io/chrome-for-testing/latest-versions-per-milestone-with-downloads.json"

        if driver_version=$(curl --location --fail --retry 3 --retry-delay 2 "$legacy_url" 2>/dev/null); then
          download_url="https://chromedriver.storage.googleapis.com/${driver_version}/chromedriver_linux64.zip"
        else
          # Fall back to Chrome for Testing API
          driver_version=$(curl --location --fail --retry 3 --retry-delay 2 "$cft_json_url" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['milestones']['${milestone}']['version'])")
          download_url="https://storage.googleapis.com/chrome-for-testing-public/${driver_version}/linux64/chromedriver-linux64.zip"
        fi

        wget -c -nc --retry-connrefused --tries=3 -q "$download_url" -O chromedriver_linux64.zip
        unzip -o -q "chromedriver_linux64.zip"
        # Legacy API: chromedriver at root; CfT API: in chromedriver-linux64/
        if [ -f chromedriver ]; then
          sudo mv chromedriver /usr/local/bin/chromedriver
        else
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
        fi
        rm "chromedriver_linux64.zip"

    - name: Set up Python ${{ inputs.python }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python }}
