name: tests

on:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  test-anki-matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Qt5 entries
          - anki: anki-2154
            python: 3.9.15
            qt: qt5-2154
            qt-api: pyqt5
            chrome: 94.0.4606.126
          - anki: anki-2165
            python: 3.9.15
            qt: qt5-2165
            qt-api: pyqt5
            chrome: 108.0.5359.220
          - anki: anki-2312
            python: 3.9.15
            qt: qt5-2312
            qt-api: pyqt5
            chrome: 112.0.5615.213
          - anki: anki-2411
            python: 3.9.18
            qt: qt5-2411
            qt-api: pyqt5
            chrome: 112.0.5615.213
          # Qt6 entries
          - anki: anki-2502
            python: 3.10.16
            qt: qt6-2502
            qt-api: pyqt6
            chrome: 112.0.5615.213
          - anki: anki-2507
            python: 3.11.11
            qt: qt6-2507
            qt-api: pyqt6
            chrome: 130.0.6723.44
          - anki: anki-2509
            python: 3.12.9
            qt: qt6-2509
            qt-api: pyqt6
            chrome: 122.0.6261.171
          - anki: anki-2509
            python: 3.13.3
            qt: qt6-2509
            qt-api: pyqt6
            chrome: 122.0.6261.171
            selenium: true
          - anki: anki-2509
            python: 3.14
            qt: qt6-2509
            qt-api: pyqt6
            chrome: 122.0.6261.171
          - anki: anki-2154
            python: 3.9.15
            qt: qt6-2154
            qt-api: pyqt6
            chrome: 94.0.4606.126
          - anki: anki-2165
            python: 3.9.15
            qt: qt6-2165
            qt-api: pyqt6
            chrome: 108.0.5359.220
          - anki: anki-2312
            python: 3.9.15
            qt: qt6-2312
            qt-api: pyqt6
            chrome: 112.0.5615.213
          - anki: anki-2411
            python: 3.9.18
            qt: qt6-2411
            qt-api: pyqt6
            selenium: true
            chrome: 112.0.5615.213

    steps:
      - name: Checkout pytest-anki
        uses: actions/checkout@v4

      - name: Set up test environment
        uses: ./.github/actions/setup
        with:
          python: ${{ matrix.python }}
          chrome: ${{ matrix.chrome }}
          anki: ${{ matrix.anki }}
          qt: ${{ matrix.qt }}

      - name: Install selenium for web debugging tests
        if: ${{ matrix['selenium'] }}
        shell: bash
        run: uv pip install "selenium>=3.141.0"

      - name: Run tests for ${{ matrix.anki }} (${{ matrix['qt-api'] }})
        shell: bash
        env:
          PYTEST_ADDOPTS: -o qt_api=${{ matrix['qt-api'] }}
        run: |
          make test

  test-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - anki: anki-2509
            python: "3.13"
            qt: qt6-2509
            qt-api: pyqt6
            chrome: 122.0.6261.171

    steps:
      - uses: actions/checkout@v4

      - name: Set up chromedriver
        shell: bash
        run: |
          set -euo pipefail
          chrome_version=${{ matrix.chrome }}
          milestone="${chrome_version%%.*}"
          cft_json_url="https://googlechromelabs.github.io/chrome-for-testing/latest-versions-per-milestone-with-downloads.json"
          driver_version=$(curl --location --fail --retry 3 --retry-delay 2 "$cft_json_url" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['milestones']['${milestone}']['version'])")
          download_url="https://storage.googleapis.com/chrome-for-testing-public/${driver_version}/mac-x64/chromedriver-mac-x64.zip"
          curl -L "$download_url" -o chromedriver-mac-x64.zip
          unzip -o -q chromedriver-mac-x64.zip
          sudo mv chromedriver-mac-x64/chromedriver /usr/local/bin/chromedriver
          rm -rf chromedriver-mac-x64.zip chromedriver-mac-x64

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install project
        shell: bash
        run: |
          pip install uv
          uv sync --no-default-groups --group dev --extra ${{ matrix.anki }} --extra ${{ matrix.qt }}

      - name: Run tests
        shell: bash
        env:
          PYTEST_ADDOPTS: -o qt_api=${{ matrix['qt-api'] }} -p no:xvfb
        run: |
          make test

  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.13"
          python-version: "3.9"
      - name: Install project
        run: uv sync --only-group dev
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.13"
          python-version: "3.9"
      - name: Install project
        run: uv sync --only-group dev
      - name: Run linter
        run: make lint

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.13"
          python-version: "3.9"
      - name: Install project
        run: uv sync --only-group dev
      - name: Run type checker
        run: make check

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up test environment
        uses: ./.github/actions/setup
        with:
          python: 3.12.9
          chrome: 122.0.6261.171
          anki: anki-2509
          qt: qt6-2509
      - name: Run tests with coverage
        shell: bash
        env:
          PYTEST_ADDOPTS: -o qt_api=pyqt6
        run: |
          python -m pytest --cov=pytest_anki --cov-report=xml --cov-report=term -n4 tests/
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
