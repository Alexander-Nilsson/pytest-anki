name: tests

on:
  workflow_call:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  test-anki-matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Qt5 entries (single representative — https://github.com/ankitects/anki/releases/tag/24.11)
          - anki: anki-2411
            python: 3.9.18
            qt: qt5-2411
            qt-api: pyqt5
            chrome: 112.0.5615.213
          # Qt6 entries
          - anki: anki-2502
            python: 3.10.16
            qt: qt6-2502
            qt-api: pyqt6
            chrome: 112.0.5615.213
          - anki: anki-2507
            python: 3.11.11
            qt: qt6-2507
            qt-api: pyqt6
            chrome: 130.0.6723.44
          - anki: anki-2509
            python: 3.12.9
            qt: qt6-2509
            qt-api: pyqt6
            chrome: 122.0.6261.171
          - anki: anki-2509
            python: 3.13.3
            qt: qt6-2509
            qt-api: pyqt6
            chrome: 122.0.6261.171
            selenium: true
          - anki: anki-2509
            python: 3.14
            qt: qt6-2509
            qt-api: pyqt6
            chrome: 122.0.6261.171
          - anki: anki-2154
            python: 3.9.15
            qt: qt6-2154
            qt-api: pyqt6
            chrome: 94.0.4606.126
          - anki: anki-2165
            python: 3.9.15
            qt: qt6-2165
            qt-api: pyqt6
            chrome: 108.0.5359.220
          - anki: anki-2312
            python: 3.9.15
            qt: qt6-2312
            qt-api: pyqt6
            chrome: 112.0.5615.213
          - anki: anki-2411
            python: 3.9.18
            qt: qt6-2411
            qt-api: pyqt6
            selenium: true
            chrome: 112.0.5615.213

    steps:
      - name: Checkout pytest-anki
        uses: actions/checkout@v4

      - name: Set up test environment
        uses: ./.github/actions/setup
        with:
          python: ${{ matrix.python }}
          chrome: ${{ matrix.chrome }}
          anki: ${{ matrix.anki }}
          qt: ${{ matrix.qt }}

      - name: Install selenium for web debugging tests
        if: ${{ matrix['selenium'] }}
        shell: bash
        run: uv pip install "selenium>=3.141.0"

      - name: Run tests for ${{ matrix.anki }} (${{ matrix['qt-api'] }})
        shell: bash
        env:
          PYTEST_ADDOPTS: -o qt_api=${{ matrix['qt-api'] }}
        run: |
          COV=""
          if [[ "${{ matrix.anki }}" == "anki-2509" && "${{ matrix.python }}" == "3.12.9" ]]; then
            COV="--cov=pytest_anki --cov-report=xml --cov-report=term"
          fi
          python -m pytest $COV -n4 tests/

      - name: Upload coverage report
        if: ${{ matrix.anki == 'anki-2509' && matrix.python == '3.12.9' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.13"
          python-version: "3.9"
          enable-cache: false
      - name: Install project
        run: uv sync --only-group dev
      - name: Run quality checks (ruff, ruff-format, ty)
        run: uv run pre-commit run --all-files --show-diff-on-failure

