name: tests

on:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/dependabot.yml"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/dependabot.yml"

jobs:
  test-anki-matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Qt5 entries
          - anki: anki-2154
            python: 3.9.15
            qt: qt5-2154
            qt-api: pyqt5
            chrome: 94.0.4606.126
          - anki: anki-2165
            python: 3.9.15
            qt: qt5-2165
            qt-api: pyqt5
            chrome: 108.0.5359.220
          - anki: anki-2312
            python: 3.9.15
            qt: qt5-2312
            qt-api: pyqt5
            chrome: 112.0.5615.213
          - anki: anki-2411
            python: 3.9.18
            qt: qt5-2411
            qt-api: pyqt5
            chrome: 112.0.5615.213
          # Qt6 entries
          - anki: anki-2502
            python: 3.10.16
            qt: qt6-2502
            qt-api: pyqt6
            chrome: 112.0.5615.213
          - anki: anki-2507
            python: 3.11.11
            qt: qt6-2507
            qt-api: pyqt6
            chrome: 130.0.6723.44
          - anki: anki-2509
            python: 3.12.9
            qt: qt6-2509
            qt-api: pyqt6
            chrome: 122.0.6261.171
          - anki: anki-2509
            python: 3.13.3
            qt: qt6-2509
            qt-api: pyqt6
            chrome: 122.0.6261.171
            selenium: true
          - anki: anki-2154
            python: 3.9.15
            qt: qt6-2154
            qt-api: pyqt6
            chrome: 94.0.4606.126
          - anki: anki-2165
            python: 3.9.15
            qt: qt6-2165
            qt-api: pyqt6
            chrome: 108.0.5359.220
          - anki: anki-2312
            python: 3.9.15
            qt: qt6-2312
            qt-api: pyqt6
            chrome: 112.0.5615.213
          - anki: anki-2411
            python: 3.9.18
            qt: qt6-2411
            qt-api: pyqt6
            selenium: true
            chrome: 112.0.5615.213

    steps:
      - name: Checkout pytest-anki
        uses: actions/checkout@v4

      - name: Set up test environment
        uses: ./.github/actions/setup
        with:
          python: ${{ matrix.python }}
          chrome: ${{ matrix.chrome }}
          anki: ${{ matrix.anki }}
          qt: ${{ matrix.qt }}

      - name: Install selenium for web debugging tests
        if: ${{ matrix['selenium'] }}
        shell: bash
        run: uv pip install "selenium>=3.141.0"

      - name: Run tests for ${{ matrix.anki }} (${{ matrix['qt-api'] }})
        shell: bash
        env:
          PYTEST_ADDOPTS: -o qt_api=${{ matrix['qt-api'] }}
        run: |
          make test

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.13"
          python-version: "3.9"
      - name: Install project
        run: uv sync --only-group dev
      - name: Run linter
        run: make lint

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up test environment
        uses: ./.github/actions/setup
        with:
          python: 3.9.15
          chrome: 112.0.5615.213
          anki: anki-2411
          qt: qt6-2411
      - name: Run type checkers
        shell: bash
        run: |
          make check
